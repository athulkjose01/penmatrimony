<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Failed - Pentecost Matrimony</title>
    
    <!-- FONT AWESOME & GOOGLE FONTS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Georgia&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- BOOTSTRAP CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* --- CORE STYLES (Your Original Theme) --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Georgia', serif; line-height: 1.6; color: #E0E0E0; background: black;
            min-height: 100vh; display: flex; flex-direction: column; position: relative;
        }
        body::before {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background:
                radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(138, 43, 226, 0.2) 0%, transparent 50%);
            pointer-events: none; z-index: -1;
        }
        .main-view-container {
            flex-grow: 1; display: flex; align-items: center; justify-content: center;
            padding: 40px 20px;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); }
        }

        /* --- IMPROVED STYLES FOR THE STATUS CARD --- */
        .status-card {
            background: rgba(30, 0, 40, 0.85); backdrop-filter: blur(10px);
            border-radius: 20px;
            /* More generous padding for desktop */
            padding: 50px 40px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            position: relative; z-index: 1; text-align: center;
            animation: fadeInUp 0.6s ease-out forwards; opacity: 0;
            width: 100%;
            /* Wider card for better laptop view */
            max-width: 600px;
            margin: 0 auto;
        }
        .status-card::before { /* Top border accent */
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px;
            border-top-left-radius: 20px; border-top-right-radius: 20px;
            background: linear-gradient(45deg, #d32f2f, #ff7043);
        }
        .card-icon {
            font-size: 4.5rem; /* Slightly larger icon */
            margin-bottom: 25px;
            text-shadow: 0 0 25px rgba(220, 53, 69, 0.7);
            color: #dc3545;
        }
        .card-title {
            font-family: 'Playfair Display', serif; font-size: 2.5rem; color: white;
            margin-bottom: 15px;
        }
        .card-subtitle {
            font-size: 1.1rem; color: #c0c0c0;
            margin-bottom: 25px;
        }

        /* NEW: Highlight box for the specific error message */
        .error-details {
            background: rgba(0, 0, 0, 0.2);
            border-left: 3px solid #ff7043;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            color: #f0f0f0;
            font-style: italic;
        }
        
        .action-buttons {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .action-button {
            padding: 15px 40px; border: none; border-radius: 50px;
            font-weight: 700; font-size: 1rem; text-transform: uppercase; letter-spacing: 1px;
            color: white; cursor: pointer; font-family: 'Georgia', serif;
            display: inline-flex; align-items: center; gap: 10px; text-decoration: none;
            transition: all 0.3s ease;
            background: linear-gradient(45deg, #ff5722, #ff8a65);
            box-shadow: 0 10px 30px rgba(255, 87, 34, 0.3);
            /* Button fits content on desktop, not full-width */
            width: auto;
        }
        .action-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(255, 87, 34, 0.4);
        }

        /* NEW: Secondary action for contacting support */
        .secondary-action a {
            color: #aaa;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }
        .secondary-action a:hover {
            color: #fff;
            text-decoration: underline;
        }

        /* --- RESPONSIVE ADJUSTMENTS FOR MOBILE --- */
        @media (max-width: 768px) {
            .status-card { padding: 40px 25px; }
            .card-title { font-size: 2rem; }
            .card-icon { font-size: 3.5rem; }
            .action-button {
                /* Full width button on mobile for easier tapping */
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="main-view-container container">
        <div class="row justify-content-center">
            <div class="col-11 col-lg-10">
                <div class="status-card">
                    <div class="card-icon">
                        <i class="fas fa-exclamation-triangle"></i>
                    </div>
                    <h1 class="card-title">Payment Failed</h1>
                    <p class="card-subtitle">Unfortunately, something went wrong while processing your payment.</p>
                    
                    <div class="error-details">
                        {{ message|default:"Your transaction could not be completed at this time." }}
                    </div>

                    <div class="action-buttons">
                        <a href="{% url 'subscribe' %}" class="action-button">
                            <i class="fas fa-redo-alt"></i> Try Again
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
