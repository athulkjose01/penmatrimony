<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Membership - Pentecost Matrimony</title>
    <link rel="manifest" href="{% static 'manifest.json' %}">
    <meta name="theme-color" content="#000000">
    <link rel="icon" href="{% static 'icons/icon-192x192.png' %}">
    
    <!-- FONT AWESOME & GOOGLE FONTS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Georgia&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- BOOTSTRAP CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* --- CORE STYLES (Your Original Styles) --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            line-height: 1.6;
            color: #E0E0E0;
            background: black;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(138, 43, 226, 0.2) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        .main-view-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        
        /* --- STYLES SPECIFIC TO THIS SUBSCRIBE PAGE --- */
        .subscription-card {
            background: rgba(30, 0, 40, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px 30px; /* Increased padding */
            box-shadow: 0 10px 35px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
            z-index: 1;
            text-align: center;
            animation: fadeInUp 0.6s ease-out forwards;
            opacity: 0;
            width: 100%;
            max-width: 600px; /* Adjusted max-width for better look */
            margin: 0 auto;
        }

        .subscription-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(45deg, #4B0082, #8A2BE2, #DDA0DD);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        }
        
        .card-header-icon {
            font-size: 3rem;
            color: #DDA0DD;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(221, 160, 221, 0.5);
        }

        .card-subtitle {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: white;
            margin-bottom: 5px;
        }
        
        .price-display {
            margin-bottom: 30px;
        }

        .price-display .amount {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(45deg, #fff, #DDA0DD);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .features-list {
            list-style: none;
            padding: 0;
            margin: 0 auto 30px auto;
            max-width: 320px;
            text-align: left;
        }

        .features-list li {
            margin-bottom: 12px;
            font-size: 1.05rem;
            color: #d0d0d0;
            display: flex;
            align-items: center;
        }

        .features-list i {
            color: #28a745; /* Green checkmark */
            margin-right: 12px;
            font-size: 1.2rem;
        }

        .pay-button { /* Changed ID to class */
            padding: 18px 40px;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: white;
            cursor: pointer;
            font-family: 'Georgia', serif;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(75, 0, 130, 0.4);
            background: linear-gradient(45deg, #4B0082, #8A2BE2, #DDA0DD);
            width: 100%;
            justify-content: center;
            margin-bottom: 20px;
        }

        .pay-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(75, 0, 130, 0.5);
        }

        .secure-payment-notice {
            font-size: 0.9rem;
            color: #999;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .secure-payment-notice i {
            font-size: 1.2rem;
            color: #6739B7; /* PhonePe Purple */
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* --- RESPONSIVE MEDIA QUERIES --- */
        @media (max-width: 768px) {
             .subscription-card { padding: 30px 25px; }
             .card-subtitle { font-size: 1.8rem; }
             .price-display .amount { font-size: 3rem; }
             .pay-button { padding: 15px 30px; font-size: 1rem; }
        }

    </style>
</head>
<body>

    <div class="main-view-container container">
        <div class="row justify-content-center">
            <div class="col-11 col-lg-10 col-xl-8">

                <div class="subscription-card">
                    <div class="card-header-icon">
                    </div>
                    <h1 class="card-subtitle">Premium Membership</h1>

                    <div class="price-display">
                        <!-- The amount is now passed from your subscribe_page view -->
                        <span class="amount">₹ {{ plan_amount }}/Yr</span>
                    </div>

                    <ul class="features-list">
                        <li><i class="fas fa-check-circle"></i> View Unlimited User Profiles</li>
                        <li><i class="fas fa-check-circle"></i> Send Unlimited Interests</li>
                        <li><i class="fas fa-check-circle"></i> Message Directly with Matches</li>
                        <li><i class="fas fa-check-circle"></i> Priority Profile Listing in Search</li>
                    </ul>

                    <!--
                        *** THE CRUCIAL FIX IS HERE ***
                        This form POSTs to your 'phonepe_initiate' view.
                        There is no JavaScript needed to handle the click.
                    -->
                    <form action="{% url 'phonepe_initiate' %}" method="POST">
                        {% csrf_token %}
                        <button type="submit" class="pay-button">
                            <i class="fas fa-shield-alt"></i> Become a Premium Member
                        </button>
                    </form>

                    <div class="secure-payment-notice">
                        <i class="fas fa-lock"></i> Secure Payment via PhonePe
                    </div>
                </div>

            </div>
        </div>
    </div>

    
</body>
</html>
